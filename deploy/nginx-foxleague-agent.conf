# Template: the foxleague-agent dashboard (127.0.0.1:8870) behind nginx with TLS. Replace agent.example.com with
# your domain, then get a certificate (for example certbot --nginx). The app sends its own security headers.
# certbot --nginx adds the 443 server and the HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name agent.example.com;

    location / {
        proxy_pass http://127.0.0.1:8870;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Talk to the manager waits for the model's whole answer: up to 17 minutes at the highest effort.
        proxy_read_timeout 1080s;
        client_max_body_size 256k;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/foxleague.access.log;
    error_log  /var/log/nginx/foxleague.error.log;
}
