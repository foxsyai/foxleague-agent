# Template: the foxleague-agent dashboard (127.0.0.1:8870) behind nginx with TLS. Replace agent.example.com with
# your domain everywhere in this file. The app sends its own security headers.
#
# Get the certificate BEFORE you enable this file (docs/SERVER.md has the steps): the second server block names
# its two files, and nginx does not start without them. The dashboard is never served on plain http, not even
# for the minutes before the certificate exists: a password typed there would travel in clear.

# The sign-in page: one address gets 30 requests a minute (and 10 at once) before nginx answers 429 itself. The app
# keeps its own lock on wrong passwords (per IPv4 address, per /64 for IPv6); this only keeps a flood away from it.
# This line belongs outside the server blocks; with two copies of this file, give each zone its own name.
limit_req_zone $binary_remote_addr zone=foxleague_login:1m rate=30r/m;

# Port 80 only answers the certificate challenge and sends everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name agent.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# Port 443: the dashboard. Every location that reaches the app belongs in this block.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.example.com;

    ssl_certificate     /etc/letsencrypt/live/agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;

    location = /login {
        limit_req zone=foxleague_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8870;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
    }

    location / {
        proxy_pass http://127.0.0.1:8870;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Talk to the manager waits for the model's whole answer: up to 12 minutes at the highest effort.
        proxy_read_timeout 900s;
        client_max_body_size 256k;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/foxleague.access.log;
    error_log  /var/log/nginx/foxleague.error.log;
}
