# CI for foxleague-agent (owner decision 2026-10-13). It runs when a maintainer marks a pull request into main
# as a merge candidate with the label merge-check (adding a label needs triage or write access, which this repo
# gives only to its maintainers), on every push to main and
# on demand. Opening or updating a pull request starts nothing, so nobody can spend the project's CI minutes by
# opening pull requests. Its result reaches main as the commit status "foxleague-agent/ci", posted by the
# project's own GitHub App (FoxLeague Agent Checks), and main requires that status from that App: a workflow a
# pull request brings can name a check "ci", but it cannot post as the App (review of these workflows, finding 1).
#   - pull_request_target: this file and its steps always come from main, never from the pull request; the
#     pull request's code is checked out and tested in the job "ci", which holds no secret, can only read the
#     repository and uses no cache (no workflow here restores one, so nothing it writes is ever used);
#   - the job "report" runs afterwards on a fresh runner that never sees the pull request's code: it alone mints
#     the App's token and posts the result;
#   - a run started by any other label fails unless merge-check is on the pull request, and a commit pushed after
#     the run has no result, so the pull request cannot merge until merge-check is added again.
name: CI

on:
  pull_request_target:
    types: [labeled]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only a merge candidate is tested
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'merge-check') }}
        run: |
          if [[ "$HAS_LABEL" != "true" ]]; then
            echo "::error::This pull request is not marked merge-check: CI runs only when a maintainer adds that label."
            exit 1
          fi

      # A pull request: its merge onto main, as GitHub computes it now. A push or a dispatch: that commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      # The result attaches to the pull request's head: the merge commit tested must have it as its second parent
      # (read from the commit object, which a shallow checkout has), or a push during the run would be tested
      # under the old head's name.
      - name: The code tested is the head that gets the result
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          second=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | sed -n 2p)
          if [[ "$second" != "$HEAD_SHA" ]]; then
            echo "::error::The pull request changed since merge-check was added: add merge-check again to test its newest commit."
            exit 1
          fi

      # No cache: under pull_request_target the pull request's code runs in main's cache scope.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: The dashboard script parses
        run: |
          sed -n '/^<script>$/,/^<\/script>/p' src/web/dashboard.html | sed '1d;$d' > "$RUNNER_TEMP/dashboard.js"
          test -s "$RUNNER_TEMP/dashboard.js"
          node --check "$RUNNER_TEMP/dashboard.js"

      - name: The reviewer's workspace gate holds
        run: python3 scripts/ci/test_review_gate.py

      - name: The manual builds
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run build

  report:
    name: report ci
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The App's token (this job only, never where the pull request's code ran)
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CHECKS_APP_ID }}
          private-key: ${{ secrets.CHECKS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Post foxleague-agent/ci
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          RESULT: ${{ needs.ci.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$RESULT" == "success" ]]; then state=success; text="type check, tests, dashboard script, gate tests and the manual passed"
          else state=failure; text="CI did not pass ($RESULT)"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=foxleague-agent/ci \
            -f description="$text" -f target_url="$RUN" --jq '"posted \(.context): \(.state)"'
