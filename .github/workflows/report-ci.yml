# Posts the result of CI (ci.yml) as the commit status "foxleague-agent/ci", as the project's GitHub App
# (FoxLeague Agent Checks), which main requires: a workflow a pull request brings can name a check "ci", but it
# cannot post as the App (review of the workflows, finding 1).
#
# workflow_run runs this file from main, after CI ends. It never checks out or runs anything of the pull request:
# it reads only the finished run's conclusion, head commit and path. The App's key is a secret of the environment
# "checks", which only main may use, so no workflow on another branch can mint the App's token (review of PR #5).
name: report-ci

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  report:
    name: report ci
    # Only the real CI file: a pull request may add another workflow named CI elsewhere. A pull request that
    # changes ci.yml itself fails the agent review, so its CI result never merges on its own.
    if: ${{ github.event.workflow_run.path == '.github/workflows/ci.yml' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: checks
    steps:
      - name: The App's token, for commit statuses only
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CHECKS_APP_ID }}
          private-key: ${{ secrets.CHECKS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Post foxleague-agent/ci
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          if [[ "$RESULT" == "success" ]]; then state=success; text="type check, tests, dashboard script, gate tests and the manual passed"
          else state=failure; text="CI did not pass ($RESULT)"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=foxleague-agent/ci \
            -f description="$text" -f target_url="$RUN" --jq '"posted \(.context): \(.state)"'
