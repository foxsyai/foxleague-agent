<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>FoxLeague Agent: Sign in</title>
<style>
  /* Same card as the foxsy-trading and foxsy-mm sign-in pages. */
  :root{--bg:#0b0e14;--panel:#141924;--line:#242c3d;--fg:#e6edf7;--dim:#8b97ad;--acc:#f5a524;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
        border-radius:14px;padding:28px}
  .logo{font-size:26px;text-align:center;margin-bottom:4px}
  h1{font-size:17px;margin:0 0 2px;text-align:center;font-weight:600}
  .sub{margin:0 0 22px;text-align:center;font-size:12px;color:var(--dim)}
  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px;text-transform:uppercase;
        letter-spacing:.06em}
  input{width:100%;padding:11px 12px;background:#0d1119;border:1px solid var(--line);
        border-radius:8px;color:var(--fg);font-size:16px}
  input:focus{outline:none;border-color:var(--acc)}
  button{width:100%;margin-top:22px;padding:12px;background:var(--acc);color:#1a1300;border:0;
         border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  button:active{opacity:.85}
  .err{margin-top:16px;padding:10px 12px;background:#3a1620;border:1px solid #7d2740;
       border-radius:8px;color:#ffb3c1;font-size:13px}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--dim)}
</style></head><body>
  <form class="card" method="post" action="/login">
    <div class="logo">🦊</div>
    <h1>FoxLeague Agent</h1>
    <p class="sub">Agent control panel</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err">{{ERROR}}</div>
    <div class="foot">Authorised access only</div>
  </form>
  <script>
    // The server leaves the placeholder empty when there is nothing to say.
    const e=document.querySelector('.err');
    e.style.display = (!e.textContent.trim() || e.textContent.includes('{{')) ? 'none' : 'block';
  </script>
</body></html>
