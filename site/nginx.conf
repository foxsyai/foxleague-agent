server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default for every response: always revalidate with the origin.
    # Browser sends If-None-Match / If-Modified-Since, nginx returns 304 on no change.
    # This prevents stale cached HTML from lingering in browsers or edge caches when
    # content updates ship — the price is one round-trip per load instead of zero.
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Astro Starlight emits clean `/path/index.html` URLs (trailingSlash: 'always').
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Astro fingerprints these filenames by content hash, so they can be cached
    # forever — a content change produces a new filename and the HTML references it.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # No log noise for the healthcheck
    location = / {
        access_log off;
        try_files /index.html =404;
    }
}
