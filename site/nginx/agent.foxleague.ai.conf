# Step 2, after `certbot certonly --webroot -w /var/www/html -d agent.foxleague.ai`: the full site.
# Replaces the step 1 file (/etc/nginx/sites-available/foxleague-agent); nginx -t && systemctl reload nginx.
# site/deploy-site.sh fills the root. No http2 on the listen lines: on nginx 1.24 it would switch every site on
# the shared 443 socket; the TLS settings are certbot's, like those of the server's other sites.
server {
    listen 80;
    listen [::]:80;
    server_name agent.foxleague.ai;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://agent.foxleague.ai$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.foxleague.ai;
    ssl_certificate     /etc/letsencrypt/live/agent.foxleague.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.foxleague.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/agent.foxleague.ai;
    index index.html;
    error_page 404 /404.html;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / { try_files $uri $uri/ $uri/index.html =404; }

    # Fingerprinted assets: cached for good. A location's add_header replaces the server's, so all repeat here.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
