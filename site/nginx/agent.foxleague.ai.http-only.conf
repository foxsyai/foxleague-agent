# Step 1 on the website droplet: port 80 only, so certbot can answer the HTTP challenge.
# /etc/nginx/sites-available/foxleague-agent, linked from sites-enabled; nginx -t && systemctl reload nginx
# The name sorts after foxkeeper.foxsy.ai on purpose: with no default_server on 443, the first site nginx loads
# answers unknown hosts, and that stays the droplet's current one.
server {
    listen 80;
    listen [::]:80;
    server_name agent.foxleague.ai;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://agent.foxleague.ai$request_uri; }
}
