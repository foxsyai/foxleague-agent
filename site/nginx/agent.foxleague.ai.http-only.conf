# Step 1 on the website server: port 80 only, so certbot can answer the HTTP challenge.
# /etc/nginx/sites-available/foxleague-agent, linked from sites-enabled; nginx -t && systemctl reload nginx
# On a server with other sites the file's name matters: with no default_server on 443, the first site nginx loads
# answers unknown hosts, so this name is chosen to sort after the one that should keep doing so.
server {
    listen 80;
    listen [::]:80;
    server_name agent.foxleague.ai;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://agent.foxleague.ai$request_uri; }
}
